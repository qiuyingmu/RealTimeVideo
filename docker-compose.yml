services:
  # ======================== MySQL 数据库 ========================
  db:
    image: mysql:8.0
    container_name: realtimevideo-db
    restart: unless-stopped
    networks:
      - backend-net
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: realtime_video
      MYSQL_USER: videoapp
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-VideoApp@2026}
    # 生产环境不暴露数据库端口。如需本地调试，取消下方注释：
    # ports:
    #   - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================== Spring Boot 后端 ========================
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: realtimevideo-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 数据库
      DB_URL: jdbc:mysql://db:3306/realtime_video?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_USERNAME: videoapp
      DB_PASSWORD: ${MYSQL_PASSWORD:-VideoApp@2026}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      # 萤石云
      EZS_APP_KEY: ${EZS_APP_KEY}
      EZS_APP_SECRET: ${EZS_APP_SECRET}
      # CORS（容器内）
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80,http://localhost,http://127.0.0.1:5173,http://47.108.204.59,http://47.108.204.59:8080
    ports:
      - "8080:8080"
    networks:
      - backend-net
      - frontend-net

  # ======================== Nginx 前端 ========================
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: realtimevideo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - frontend-net

volumes:
  mysql_data:

networks:
  # 后端网络：db 和 backend 在此网络下互通
  # 注意：不设 internal=true，backend 需要访问外网（萤石云 API）
  backend-net:
    name: realtimevideo-backend
  # 前端网络：backend 和 frontend 在此网络下互通
  frontend-net:
    name: realtimevideo-frontend
