server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: realtime-video-backend

  datasource:
    url: ${DB_URL:jdbc:h2:mem:realtimevideo}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  h2:
    console:
      enabled: ${H2_CONSOLE:true}
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# ──────────── 敏感配置（通过环境变量注入）────────────
# 不要在 application.yml 中写入真实值！
# 开发环境：在 IDE 运行配置或 .env 文件中设置环境变量
# 生产环境：在服务器 / systemd / docker-compose 中设置
# 示例：export EZS_APP_KEY=your_key

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

security:
  login:
    max-attempts: 5
    lock-duration-minutes: 30

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

ezviz:
  app-key: ${EZS_APP_KEY:}
  app-secret: ${EZS_APP_SECRET:}

logging:
  level:
    com.realtimevideo: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/realtime_video?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}

  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:}

logging:
  level:
    com.realtimevideo: WARN
