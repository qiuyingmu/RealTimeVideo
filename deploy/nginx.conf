# ============================================================
# RealTimeVideo — Nginx 配置
#
# 使用方式：
#   开发/初始部署：默认使用 80 端口 HTTP
#   生产环境：取消下方 HTTPS server block 注释并配置证书
#
# HTTPS 证书获取（Let's Encrypt）：
#   1. 安装 certbot: apt install certbot python3-certbot-nginx
#   2. 执行: certbot --nginx -d your-domain.com
#   3. certbot 会自动修改本文件并配置证书路径
# ============================================================

server {
    listen 80;
    server_name _;
    charset utf-8;

    # Docker DNS 解析器：使用变量 proxy_pass 强制运行时解析 hostname，
    # 避免 nginx 启动时 "host not found in upstream" 错误
    resolver 127.0.0.11 valid=10s;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API 反代到后端
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（视频流相关请求较长）
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 萤石云 EZUIKit 解码文件反代（WASM 文件单独处理 MIME 类型）
    location ~ ^/ezuikit_cdn/.*\.wasm$ {
        rewrite ^/ezuikit_cdn/(.*)$ /ezuikit_js/v9.0.5/ezuikit_static/$1 break;
        proxy_pass https://openstatic.ys7.com;
        proxy_set_header Host openstatic.ys7.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_hide_header Content-Type;
        add_header Content-Type application/wasm;
    }
    # 其他 EZUIKit 文件（JS/CSS 等）
    location /ezuikit_cdn/ {
        rewrite ^/ezuikit_cdn/(.*)$ /ezuikit_js/v9.0.5/ezuikit_static/$1 break;
        proxy_pass https://openstatic.ys7.com;
        proxy_set_header Host openstatic.ys7.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # SPA 路由：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ============================================================
