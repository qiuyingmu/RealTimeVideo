# ============================================================
# RealTimeVideo — 宝塔面板 Nginx 配置参考
#
# 使用前先看 README 的「宝塔面板部署」章节。
# 推荐直接用 bt-nginx-full.conf 替换整个配置。
#
# 注意：如果你的 BT 配置中有 `location ~ .*\.(js|css)?$`
# 这类正则缓存规则，必须确保 /ezuikit_cdn/ 的 location
# 放在它们前面，否则 EZUIKit 文件会被错误地本地缓存。
# ============================================================

server {
    listen 80;
    server_name your-domain.com;
    index index.html;
    root /www/wwwroot/your-domain;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ──────── 后端 API ────────
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ──────── 萤石云 EZUIKit（必须放在 js/css 缓存规则前面） ────────
    # 用 ^~ 防止被 BT 的 js/css 正则 location 劫持
    location ^~ /ezuikit_cdn/ {
        rewrite ^/ezuikit_cdn/(.*)$ /ezuikit_js/v9.0.5/ezuikit_static/$1 break;
        proxy_pass https://openstatic.ys7.com;
        proxy_set_header Host openstatic.ys7.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # ──────── 前端静态文件 ────────
    location ~ /.well-known {
        allow all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
