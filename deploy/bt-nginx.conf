# ============================================================
# RealTimeVideo — 宝塔面板 Nginx 配置模板
#
# 使用方式：
#   1. 进入宝塔面板 → 网站 → 添加站点（输入域名）
#   2. 站点创建后 → 设置 → 配置文件中
#   3. 将此文件内容替换 BT 自动生成的 server block
#   4. 修改 /www/wwwroot/your-domain 为实际站点目录
#   5. 修改 server_name 为实际域名
#   6. 将前端 dist 目录上传到站点根目录
#      （dist/ 下的 index.html 应是站点根目录）
# ============================================================

server {
    listen 80;
    #listen 443 ssl http2;
    server_name your-domain.com;          # ← 改为你的域名
    index index.html;
    root /www/wwwroot/your-domain;        # ← 改为站点实际路径

    # SSL（在宝塔面板中开启 SSL 后会自动填充，取消上方 listen 443 的注释）
    # ssl_certificate    /www/server/panel/vhost/cert/your-domain/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/your-domain/privkey.pem;
    # ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ──────── 后端 API 反向代理 ────────
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时（视频流相关请求较长）
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ──────── 萤石云 EZUIKit 解码文件反代 ────────
    # WASM 文件单独处理 MIME 类型
    location ~ ^/ezuikit_cdn/.*\.wasm$ {
        rewrite ^/ezuikit_cdn/(.*)$ /ezuikit_js/v9.0.5/ezuikit_static/$1 break;
        proxy_pass https://openstatic.ys7.com;
        proxy_set_header Host openstatic.ys7.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_hide_header Content-Type;
        add_header Content-Type application/wasm;
    }

    # 其他 EZUIKit 文件（JS/CSS 等）
    location /ezuikit_cdn/ {
        rewrite ^/ezuikit_cdn/(.*)$ /ezuikit_js/v9.0.5/ezuikit_static/$1 break;
        proxy_pass https://openstatic.ys7.com;
        proxy_set_header Host openstatic.ys7.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # ──────── 前端静态文件 ────────
    # SPA 路由：所有非文件请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（构建产物的 hash 名自带版本号）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
